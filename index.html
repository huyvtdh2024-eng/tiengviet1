<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tiếng Việt Gấu" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3773/3773199.png" />
  <title>Tiếng Việt Của Gấu </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
      font-family: 'Nunito', sans-serif; background: #fffbe8;
      padding-top: max(env(safe-area-inset-top), 6px); padding-bottom: max(env(safe-area-inset-bottom), 6px); padding-left: max(env(safe-area-inset-left), 6px); padding-right: max(env(safe-area-inset-right), 6px);
    }
    
    .btn-3d { transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
    .btn-3d:active { transform: translateY(4px); border-bottom-width: 0px !important; margin-top: 4px; }
    .board-3d { background: #ffffff; border: 4px solid #fef08a; box-shadow: 0 12px 24px -6px rgba(0,0,0,0.1), inset 0 -6px 0 rgba(0,0,0,0.03); border-radius: 24px; }
    .map-bg { background: linear-gradient(180deg, #fef9c3 0%, #fef08a 100%); background-image: radial-gradient(#fde047 20%, transparent 20%); background-size: 40px 40px; }
    
    @keyframes floatBaby { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .animate-float { animation: floatBaby 3s ease-in-out infinite; }
    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    .animate-pop { animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    .app-view { display: none; width: 100%; height: 100%; flex-direction: column; }
    .app-view.active { display: flex; }

    /* Lật thẻ */
    .flip-card { perspective: 1000px; width: 100%; height: 100%; cursor: pointer; }
    .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom-width: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .flip-card-back { transform: rotateY(180deg); background: #fdf2f8; border-color: #fbcfe8; }
    .vowel-front { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }
    .consonant-front { background: #e0f2fe; border-color: #7dd3fc; color: #0284c7; }

    /* Máy ghép chữ */
    .slot-machine { background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%); border: 6px solid #cbd5e1; border-radius: 2rem; box-shadow: inset 0 10px 20px rgba(0,0,0,0.05); }
    .slot-window { background: #ffffff; border: 4px solid #94a3b8; border-radius: 1.2rem; box-shadow: inset 0 8px 15px rgba(0,0,0,0.1); overflow: hidden; position: relative; }
    .slot-item { font-size: 4rem; font-weight: 900; line-height: 1; display: flex; align-items: center; justify-content: center; height: 100px; transition: transform 0.2s ease-out; }
  </style>
</head>
<body class="p-1 sm:p-2 text-slate-800">

      <div id="result-score" class="text-4xl sm:text-5xl font-black text-rose-500 mb-6 bg-rose-50 px-6 py-2 rounded-2xl border-2 border-rose-200 shadow-inner">5 / 5</div>
      <button onclick="switchView('map-view'); document.getElementById('result-modal').classList.add('hidden');" class="btn-3d w-full bg-amber-400 text-amber-950 font-black text-lg sm:text-xl py-3 rounded-2xl shadow border-b-4 border-amber-600">🗺️ Về Bản Đồ</button>
    </div>

  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

  <script>
    const CHILD_NAME = 'Gấu Yêu';
    let stars = parseInt(localStorage.getItem('tv1_stars') || '0', 10);
    
    // --- DATABASE ---
    const SYLLABUS = [
      {
        zoneId: 1, zoneName: "Chặng 1: Âm đơn & Dấu (Bài 1-15)", theme: { bg: "bg-emerald-50", border: "border-emerald-400", text: "text-emerald-800", btn: "bg-emerald-100" },
        lessons: [
          { id: 1, title: "Bài 1: A a", chars: [{c:'a', sound:'a', word:'ca hát', emoji:'🎤', t:'vowel'}] },
          { id: 2, title: "Bài 2: B b", chars: [{c:'b', sound:'bờ', word:'ba ba', emoji:'🐢', t:'con'}] },
          { id: 3, title: "Bài 3: C c", chars: [{c:'c', sound:'cờ', word:'con cá', emoji:'🐟', t:'con'}] },
          { id: 4, title: "Bài 4: E e, Ê ê", chars: [{c:'e', sound:'e', word:'em bé', emoji:'👶', t:'vowel'}, {c:'ê', sound:'ê', word:'bế bé', emoji:'🤱', t:'vowel'}] },
          { id: 6, title: "Bài 6: O o", chars: [{c:'o', sound:'o', word:'con bò', emoji:'🐄', t:'vowel'}] },
          { id: 7, title: "Bài 7: Ô ô", chars: [{c:'ô', sound:'ô', word:'ô tô', emoji:'🚗', t:'vowel'}] },
          { id: 8, title: "Bài 8: D d, Đ đ", chars: [{c:'d', sound:'dờ', word:'con dê', emoji:'🐐', t:'con'}, {c:'đ', sound:'đờ', word:'đi đò', emoji:'🛶', t:'con'}] },
          { id: 9, title: "Bài 9: Ơ ơ", chars: [{c:'ơ', sound:'ơ', word:'cá cờ', emoji:'🐠', t:'vowel'}] },
          { id: 11, title: "Bài 11: I i, K k", chars: [{c:'i', sound:'i', word:'viên bi', emoji:'🔵', t:'vowel'}, {c:'k', sound:'ca', word:'kì đà', emoji:'🦎', t:'con'}] },
          { id: 12, title: "Bài 12: H h, L l", chars: [{c:'h', sound:'hờ', word:'bờ hồ', emoji:'🏞️', t:'con'}, {c:'l', sound:'lờ', word:'le le', emoji:'🦆', t:'con'}] },
          { id: 13, title: "Bài 13: U u, Ư ư", chars: [{c:'u', sound:'u', word:'quả đu đủ', emoji:'🍈', t:'vowel'}, {c:'ư', sound:'ư', word:'sư tử', emoji:'🦁', t:'vowel'}] },
          { id: 14, title: "Bài 14: Ch ch, Kh kh", chars: [{c:'ch', sound:'chờ', word:'chú khỉ', emoji:'🐒', t:'con'}, {c:'kh', sound:'khờ', word:'lá khô', emoji:'🍂', t:'con'}] },
        ]
      },
      {
        zoneId: 2, zoneName: "Chặng 2: Âm ghép (Bài 16-28)", theme: { bg: "bg-sky-50", border: "border-sky-400", text: "text-sky-800", btn: "bg-sky-100" },
        lessons: [
          { id: 16, title: "Bài 16: M m, N n", chars: [{c:'m', sound:'mờ', word:'cá mè', emoji:'🐟', t:'con'}, {c:'n', sound:'nờ', word:'nơ đỏ', emoji:'🎀', t:'con'}] },
          { id: 17, title: "Bài 17: G g, Gi gi", chars: [{c:'g', sound:'gờ', word:'gà gô', emoji:'🐓', t:'con'}, {c:'gi', sound:'di', word:'giá đỗ', emoji:'🌱', t:'con'}] },
          { id: 18, title: "Bài 18: Gh gh, Nh nh", chars: [{c:'gh', sound:'gờ', word:'ghế đá', emoji:'🪑', t:'con'}, {c:'nh', sound:'nhờ', word:'nhà gỗ', emoji:'🏠', t:'con'}] },
          { id: 19, title: "Bài 19: Ng ng, Ngh ngh", chars: [{c:'ng', sound:'ngờ', word:'ngã ba', emoji:'🛣️', t:'con'}, {c:'ngh', sound:'ngờ', word:'củ nghệ', emoji:'🥔', t:'con'}] },
          { id: 21, title: "Bài 21: R r, S s", chars: [{c:'r', sound:'rờ', word:'rổ rá', emoji:'🧺', t:'con'}, {c:'s', sound:'sờ', word:'chữ số', emoji:'🔢', t:'con'}] },
          { id: 22, title: "Bài 22: T t, Tr tr", chars: [{c:'t', sound:'tờ', word:'cái tủ', emoji:'🗄️', t:'con'}, {c:'tr', sound:'trờ', word:'cá trê', emoji:'🐟', t:'con'}] },
          { id: 23, title: "Bài 23: Th th, ia", chars: [{c:'th', sound:'thờ', word:'cái thìa', emoji:'🥄', t:'con'}, {c:'ia', sound:'i a ia', word:'lá tía tô', emoji:'🌿', t:'vowel'}] },
          { id: 24, title: "Bài 24: ua, ưa", chars: [{c:'ua', sound:'u a ua', word:'cà chua', emoji:'🍅', t:'vowel'}, {c:'ưa', sound:'ư a ưa', word:'dưa lê', emoji:'🍈', t:'vowel'}] },
          { id: 26, title: "Bài 26: Ph ph, Qu qu", chars: [{c:'ph', sound:'phờ', word:'phố cổ', emoji:'🏘️', t:'con'}, {c:'qu', sound:'quờ', word:'quả khế', emoji:'⭐', t:'con'}] },
          { id: 27, title: "Bài 27: V v, X x", chars: [{c:'v', sound:'vờ', word:'quyển vở', emoji:'📔', t:'con'}, {c:'x', sound:'sờ', word:'xe lu', emoji:'🚜', t:'con'}] },
          { id: 28, title: "Bài 28: Y y", chars: [{c:'y', sound:'i', word:'y tá', emoji:'👩‍⚕️', t:'vowel'}] }
        ]
      }
    ];

    const MAC_CONSONANTS = ['b','c','d','đ','g','h','k','l','m','n','v','ch','gh','kh','nh','ng','ngh','th','tr','ph'];
    const MAC_VOWELS = ['a','o','ô','ơ','u','ư','e','ê','i','ia','ua','ưa'];
    const TONES = [{ id: 'ngang', mark: '', visual: '—', name: 'Ngang' }, { id: 'huyen', mark: '\u0300', visual: 'ˋ', name: 'Huyền' }, { id: 'sac', mark: '\u0301', visual: 'ˊ', name: 'Sắc' }, { id: 'hoi', mark: '\u0309', visual: 'ˀ', name: 'Hỏi' }, { id: 'nga', mark: '\u0303', visual: '˜', name: 'Ngã' }, { id: 'nang', mark: '\u0323', visual: '•', name: 'Nặng' }];

    const QUIZZES = [
      { word: 'cá cờ', display: 'á cờ', missing: 'c', options: ['c', 'k', 'g'], emoji: '🐠' },
      { word: 'kẻ ô', display: 'ẻ ô', missing: 'k', options: ['k', 'c', 'h'], emoji: '📏' },
      { word: 'gà gô', display: 'à gô', missing: 'g', options: ['g', 'gh', 'ng'], emoji: '🐓' },
      { word: 'ghế đá', display: 'ế đá', missing: 'gh', options: ['gh', 'g', 'nh'], emoji: '🪑' },
      { word: 'ngã ba', display: 'ã ba', missing: 'ng', options: ['ng', 'ngh', 'nh'], emoji: '🛣️' },
      { word: 'củ nghệ', display: 'ủ nghệ', missing: 'ngh', options: ['ngh', 'ng', 'gh'], emoji: '🥔' }
    ];

    const state = { currentLesson: null, currentMode: null, mCIdx: 0, mVIdx: 0, mTIdx: 1, testData: { total: 5, current: 0, correct: 0 } };

    // --- AUDIO SYSTEM TỐI ƯU ---
    let audioCtx = null;
    function initAudio() {
      if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch(e){} }
      if (!audioCtx) audioCtx = new window.AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function forceWakeUpTTS() {
      if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); const silent = new SpeechSynthesisUtterance(' '); silent.volume = 0; window.speechSynthesis.speak(silent); }
    }
    function playSound(type) {
      initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'pop') { osc.type = 'sine'; osc.frequency.setValueAtTime(500, audioCtx.currentTime); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15); }
      else if (type === 'success') { osc.type = 'triangle'; osc.frequency.setValueAtTime(659.25, audioCtx.currentTime); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); }
      else if (type === 'wrong') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); }
    }

    // ĐIỀU CHỈNH TỐC ĐỘ ĐỌC NATIVE CHO iOS CHẬM LẠI
    function speakVietnamese(text, rate = 0.6) {
      if (!text) return;
      initAudio();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'vi-VN';
        utter.rate = rate; // TỐC ĐỘ ĐƯỢC CHỈNH Ở ĐÂY (0.6 là chậm vừa phải)
        window.speechSynthesis.speak(utter);
      }
    }

    function updateStars() {
      document.getElementById('dash-stars').textContent = stars;
      document.getElementById('game-stars-txt').textContent = stars;
    }

    // --- NAVIGATION ---
    function startAppWithAudio() {
      initAudio(); forceWakeUpTTS(); playSound('success');
      document.getElementById('welcome-view').classList.add('hidden');
      updateStars(); switchView('dashboard-view');
      setTimeout(() => speakVietnamese(`Chào ${CHILD_NAME}! Hôm nay Gấu muốn học bài nào?`), 400);
    }

    function switchView(viewId) {
      playSound('pop');
      document.querySelectorAll('.app-view').forEach(el => {
        if (el.id === viewId) { el.classList.remove('hidden'); el.classList.add('flex'); }
        else { el.classList.add('hidden'); el.classList.remove('flex'); }
      });
      if(viewId === 'map-view') buildMap();
    }

    function buildMap() {
      const container = document.getElementById('zone-container'); container.innerHTML = '';
      SYLLABUS.forEach(zone => {
        const th = zone.theme;
        const zoneDiv = document.createElement('div');
        zoneDiv.className = `bg-white rounded-2xl border-4 ${th.border} shadow-sm overflow-hidden`;
        let html = `<div class="${th.bg} ${th.text} font-black px-4 py-2 text-sm sm:text-base border-b-2 ${th.border}">${zone.zoneName}</div><div class="flex flex-col">`;
        zone.lessons.forEach(lesson => {
          html += `
            <button onclick="openLessonModal(${zone.zoneId}, ${lesson.id})" class="btn-3d flex items-center gap-3 p-3 border-b border-slate-100 active:bg-slate-50 text-left">
              <div class="w-10 h-10 rounded-xl ${th.btn} ${th.border} border-2 flex items-center justify-center text-lg shrink-0">📖</div>
              <div class="font-black text-slate-700 text-sm sm:text-base">${lesson.title}</div>
            </button>
          `;
        });
        html += `</div>`; zoneDiv.innerHTML = html; container.appendChild(zoneDiv);
      });
    }

    function openLessonModal(zoneId, lessonId) {
      playSound('pop');
      const zone = SYLLABUS.find(z => z.zoneId === zoneId);
      state.currentLesson = zone.lessons.find(l => l.id === lessonId);
      document.getElementById('modal-lesson-title').textContent = state.currentLesson.title;
      document.getElementById('lesson-modal').classList.remove('hidden');
    }
    function closeLessonModal() { playSound('pop'); document.getElementById('lesson-modal').classList.add('hidden'); }

    // --- GAME ENGINE ---
    function startMode(mode) {
      closeLessonModal(); state.currentMode = mode; switchView('game-view');
      const titleEl = document.getElementById('game-header-title'); const stage = document.getElementById('game-stage'); const bar = document.getElementById('test-progress-bar');
      if (mode === 'learn') { titleEl.textContent = `🎓 Học: ${state.currentLesson.title}`; bar.classList.add('hidden'); renderLearnMode(stage); } 
      else if (mode === 'review') { titleEl.textContent = `🔁 Ôn tập Ghép Vần`; bar.classList.add('hidden'); renderMachineMode(stage); } 
      else if (mode === 'test') { titleEl.textContent = `📝 Kiểm tra`; bar.classList.remove('hidden'); state.testData.current = 0; state.testData.correct = 0; renderTestMode(stage); }
    }

    // 1. CHẾ ĐỘ HỌC LẬT THẺ (CHỮ KHỔNG LỒ)
    function renderLearnMode(stage) {
      stage.className = 'flex-1 board-3d p-3 flex flex-col relative overflow-hidden bg-amber-50';
      let gridHTML = '<div class="text-center text-amber-700 font-black text-sm mb-3">Chạm vào thẻ để nghe đọc chữ nhé!</div><div class="flex-1 overflow-y-auto flex flex-wrap justify-center items-center gap-6 pb-4">';
      
      state.currentLesson.chars.forEach((item, idx) => {
        const frontClass = item.t === 'vowel' ? 'vowel-front' : 'consonant-front';
        // KÍCH THƯỚC CHỮ TĂNG LÊN KHỔNG LỒ Ở ĐÂY
        const fontSize = item.c.length > 2 ? 'text-5xl sm:text-6xl' : item.c.length > 1 ? 'text-7xl sm:text-[6rem]' : 'text-[6rem] sm:text-[10rem] leading-none';
        
        gridHTML += `
          <div class="w-36 sm:w-56 aspect-[4/5] shrink-0">
            <div class="flip-card" id="card-${idx}" onclick="flipCard(${idx}, '${item.sound}', '${item.word}')">
              <div class="flip-card-inner">
                <div class="flip-card-front ${frontClass} border-4"><span class="${fontSize} font-black pt-2">${item.c}</span></div>
                <div class="flip-card-back border-4">
                  <span class="text-6xl sm:text-7xl mb-2 animate-float">${item.emoji}</span>
                  <span class="text-base sm:text-xl font-black text-pink-600 truncate px-2">${item.word}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      });
      gridHTML += '</div>'; stage.innerHTML = gridHTML;
    }

    window.flipCard = function(index, phonics, word) {
      playSound('pop');
      const card = document.getElementById(`card-${index}`);
      const isFlipped = card.classList.contains('flipped');
      document.querySelectorAll('.flip-card').forEach(c => c.classList.remove('flipped'));
      if (!isFlipped) { card.classList.add('flipped'); speakVietnamese(`${phonics}. ${word}`, 0.6); } // Đọc chậm 0.6
    }

    // 2. MÁY GHÉP VẦN
    function getSpellingRule(c, v) {
      const e_group = ['e','ê','i','ia'];
      if (c === 'c' && e_group.includes(v)) return 'k'; if (c === 'g' && e_group.includes(v)) return 'gh'; if (c === 'ng' && e_group.includes(v)) return 'ngh';
      if (c === 'k' && !e_group.includes(v)) return 'c'; if (c === 'gh' && !e_group.includes(v)) return 'g'; if (c === 'ngh' && !e_group.includes(v)) return 'ng';
      return c;
    }

    function renderMachineMode(stage) {
      stage.className = 'flex-1 board-3d p-2 sm:p-4 flex flex-col relative overflow-y-auto bg-slate-50 justify-center';
      stage.innerHTML = `
        <div class="bg-gradient-to-b from-slate-100 to-slate-200 border-4 border-slate-300 rounded-3xl p-3 sm:p-5 flex flex-col gap-4 max-w-lg mx-auto w-full shadow-inner">
          <div class="bg-white rounded-2xl border-4 border-purple-200 p-2 text-center shadow-sm relative overflow-hidden">
            <div class="text-[10px] font-black text-purple-400 uppercase tracking-widest mb-1">KẾT QUẢ</div>
            <div id="final-word" class="text-6xl sm:text-7xl font-black text-purple-700 h-20 flex items-center justify-center animate-pop">bà</div>
          </div>
          <div class="flex justify-between gap-1.5 sm:gap-4">
            <div class="flex-1 flex flex-col gap-1 sm:gap-2">
              <button onclick="changeSlot('c', -1)" class="btn-3d bg-white border-2 border-slate-300 rounded-xl h-10 text-slate-500 font-black shadow-sm">▲</button>
              <div class="bg-white border-4 border-slate-300 rounded-xl h-24 overflow-hidden relative"><div id="slot-c" class="text-4xl sm:text-5xl font-black text-sky-600 flex items-center justify-center h-full transition-transform">b</div></div>
              <button onclick="changeSlot('c', 1)" class="btn-3d bg-white border-2 border-slate-300 rounded-xl h-10 text-slate-500 font-black shadow-sm">▼</button>
            </div>
            <div class="flex flex-col justify-center text-3xl font-black text-slate-300 mt-6">+</div>
            <div class="flex-1 flex flex-col gap-1 sm:gap-2">
              <button onclick="changeSlot('v', -1)" class="btn-3d bg-white border-2 border-slate-300 rounded-xl h-10 text-slate-500 font-black shadow-sm">▲</button>
              <div class="bg-white border-4 border-slate-300 rounded-xl h-24 overflow-hidden relative"><div id="slot-v" class="text-4xl sm:text-5xl font-black text-rose-600 flex items-center justify-center h-full transition-transform">a</div></div>
              <button onclick="changeSlot('v', 1)" class="btn-3d bg-white border-2 border-slate-300 rounded-xl h-10 text-slate-500 font-black shadow-sm">▼</button>
            </div>
            <div class="flex flex-col justify-center text-3xl font-black text-slate-300 mt-6">+</div>
            <div class="flex-1 flex flex-col gap-1 sm:gap-2">
              <button onclick="changeSlot('t', -1)" class="btn-3d bg-white border-2 border-slate-300 rounded-xl h-10 text-slate-500 font-black shadow-sm">▲</button>
              <div class="bg-slate-50 border-4 border-slate-300 rounded-xl h-24 flex flex-col items-center justify-center">
                <div id="slot-t-visual" class="text-4xl sm:text-5xl text-emerald-600 font-black mb-1">` + TONES[state.mTIdx].visual + `</div>
                <div id="slot-t-name" class="text-[9px] font-black text-emerald-500 uppercase">Huyền</div>
              </div>
              <button onclick="changeSlot('t', 1)" class="btn-3d bg-white border-2 border-slate-300 rounded-xl h-10 text-slate-500 font-black shadow-sm">▼</button>
            </div>
          </div>
          <button onclick="playMachineResult()" class="btn-3d w-full mt-2 bg-amber-400 border-b-[6px] border-amber-600 text-amber-950 text-2xl font-black py-4 rounded-2xl shadow-lg">🪄 ĐÁNH VẦN NÀO</button>
        </div>
      `;
      updateSlotUI();
    }

    window.changeSlot = function(type, dir) {
      playSound('pop');
      if (type === 'c') state.mCIdx = (state.mCIdx + dir + MAC_CONSONANTS.length) % MAC_CONSONANTS.length;
      if (type === 'v') state.mVIdx = (state.mVIdx + dir + MAC_VOWELS.length) % MAC_VOWELS.length;
      if (type === 't') state.mTIdx = (state.mTIdx + dir + TONES.length) % TONES.length;
      updateSlotUI();
    }

    function updateSlotUI() {
      let c = getSpellingRule(MAC_CONSONANTS[state.mCIdx], MAC_VOWELS[state.mVIdx]);
      document.getElementById('slot-c').textContent = c;
      document.getElementById('slot-v').textContent = MAC_VOWELS[state.mVIdx];
      document.getElementById('slot-t-visual').textContent = TONES[state.mTIdx].visual;
      document.getElementById('slot-t-name').textContent = TONES[state.mTIdx].name;
      
      const res = document.getElementById('final-word');
      res.textContent = (c + MAC_VOWELS[state.mVIdx] + TONES[state.mTIdx].mark).normalize('NFC');
      res.classList.remove('animate-pop'); void res.offsetWidth; res.classList.add('animate-pop');
    }

    window.playMachineResult = function() {
      let v = MAC_VOWELS[state.mVIdx]; let t = TONES[state.mTIdx];
      let c = getSpellingRule(MAC_CONSONANTS[state.mCIdx], v);
      
      const sMap = {'b':'bờ','c':'cờ','k':'ca','d':'dờ','đ':'đờ','g':'gờ','gh':'gờ','h':'hờ','l':'lờ','m':'mờ','n':'nờ','v':'vờ','ch':'chờ','kh':'khờ','nh':'nhờ','th':'thờ','tr':'trờ','ph':'phờ','ng':'ngờ','ngh':'ngờ'};
      const cSound = sMap[c] || c; const vSound = v.split('').join(' '); 
      const baseWord = (c + v).normalize('NFC'); const finalWord = (c + v + t.mark).normalize('NFC');
      
      let spellString = t.id === 'ngang' ? `${cSound}, ${vSound}, ${baseWord}` : `${cSound}, ${vSound}, ${baseWord}, dấu ${t.name.toLowerCase()}, ${finalWord}`;
      
      const btn = document.querySelector('#machine-view button[onclick="playMachineResult()"]');
      if(btn) btn.classList.add('scale-105', 'bg-amber-300');
      
      // ĐỌC CHẬM RÃI KHI ĐÁNH VẦN (0.5)
      window.speechSynthesis.cancel();
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(spellString); utter.lang = 'vi-VN'; utter.rate = 0.5;
        utter.onend = () => { if(btn) btn.classList.remove('scale-105', 'bg-amber-300'); };
        window.speechSynthesis.speak(utter);
      }
    }

    // 3. CHẾ ĐỘ KIỂM TRA (TRẮC NGHIỆM)
    function renderTestMode(stage) {
      stage.className = 'flex-1 board-3d p-4 flex flex-col justify-center items-center relative overflow-hidden bg-emerald-50';
      document.getElementById('test-progress-fill').style.width = ((state.testData.current)/state.testData.total)*100 + '%';
      
      const q = QUIZZES[Math.floor(Math.random() * QUIZZES.length)]; state.currentQuiz = q;
      
      stage.innerHTML = `
        <div class="text-7xl sm:text-8xl mb-6 animate-float">${q.emoji}</div>
        <div class="flex items-center gap-2 mb-10">
          <div id="quiz-blank" class="min-w-[4rem] px-2 h-20 sm:min-w-[6rem] sm:h-24 bg-white border-4 border-dashed border-emerald-400 rounded-2xl flex items-center justify-center text-4xl sm:text-6xl font-black text-emerald-600 shadow-inner transition-all">?</div>
          <div class="text-5xl sm:text-7xl font-black text-slate-700 tracking-tight">${q.display}</div>
        </div>
        <div class="flex justify-center gap-3 sm:gap-6 w-full max-w-md">
          ${q.options.map(opt => `<button onclick="checkQuizAnswer('${opt}')" class="btn-3d flex-1 bg-white border-4 border-slate-200 border-b-[6px] text-slate-700 text-3xl sm:text-5xl font-black py-3 sm:py-4 rounded-2xl shadow hover:bg-slate-50">${opt}</button>`).join('')}
        </div>
      `;
      setTimeout(() => speakVietnamese(q.word, 0.65), 500); // Đọc từ bình thường ở chế độ này
    }

    window.checkQuizAnswer = function(selectedLetter) {
      if (selectedLetter === state.currentQuiz.missing) {
        playSound('success'); triggerConfetti();
        const blank = document.getElementById('quiz-blank');
        blank.className = 'min-w-[4rem] px-2 h-20 sm:min-w-[6rem] sm:h-24 bg-emerald-500 border-4 border-emerald-600 rounded-2xl flex items-center justify-center text-4xl sm:text-6xl font-black text-white shadow-lg animate-pop';
        blank.textContent = selectedLetter;
        speakVietnamese(`Đúng rồi! ${state.currentQuiz.word}`, 0.65);
        state.testData.correct++; stars++; localStorage.setItem('tv1_stars', stars); updateStars();
        setTimeout(() => {
          state.testData.current++;
          if (state.testData.current < state.testData.total) renderTestMode(document.getElementById('game-stage'));
          else showTestResult();
        }, 2000);
      } else {
        playSound('wrong'); speakVietnamese(`Sai rồi!`, 0.65);
        setTimeout(() => {
          state.testData.current++;
          if (state.testData.current < state.testData.total) renderTestMode(document.getElementById('game-stage'));
          else showTestResult();
        }, 2000);
      }
    }

    function showTestResult() {
      document.getElementById('result-score').textContent = `${state.testData.correct} / ${state.testData.total}`;
      const title = document.getElementById('result-title');
      if (state.testData.correct === state.testData.total) { title.textContent = "Tuyệt Đối!"; playSound('success'); triggerConfetti(); stars += 5; }
      else { title.textContent = "Cố gắng nhé!"; playSound('pop'); }
      localStorage.setItem('tv1_stars', stars); updateStars();
      document.getElementById('result-modal').classList.remove('hidden');
    }

    function triggerConfetti() {
      const cvs = document.getElementById('confetti-canvas'); const ctx = cvs.getContext('2d'); cvs.width = window.innerWidth; cvs.height = window.innerHeight;
      const p = Array.from({length:40}, ()=>({x:cvs.width/2, y:cvs.height/2, vx:(Math.random()-0.5)*15, vy:(Math.random()-0.8)*15, s:Math.random()*8+6, c:['#ec4899','#f59e0b','#8b5cf6','#10b981','#3b82f6'][Math.floor(Math.random()*5)]}));
      let f = 0; function anim() { ctx.clearRect(0,0,cvs.width,cvs.height); p.forEach(i=>{i.x+=i.vx;i.y+=i.vy;i.vy+=0.5;ctx.fillStyle=i.c;ctx.fillRect(i.x,i.y,i.s,i.s)}); if(++f<35) requestAnimationFrame(anim); else ctx.clearRect(0,0,cvs.width,cvs.height); } anim();
    }
  </script>
</body>
</html>
