<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tiếng Việt Gấu" />
    <title>Tiếng Việt Lớp 1 - v1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            font-family: 'Nunito', sans-serif;
            background: #fffbe8;
            padding-top: max(env(safe-area-inset-top), 6px);
            padding-bottom: max(env(safe-area-inset-bottom), 6px);
            padding-left: max(env(safe-area-inset-left), 6px);
            padding-right: max(env(safe-area-inset-right), 6px);
        }

        .btn-3d {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

            .btn-3d:active {
                transform: translateY(4px);
                border-bottom-width: 0px !important;
                margin-top: 4px;
            }

        .board-3d {
            background: #ffffff;
            border: 4px solid #fef08a;
            box-shadow: 0 12px 24px -6px rgba(0,0,0,0.1), inset 0 -6px 0 rgba(0,0,0,0.03);
            border-radius: 24px;
        }

        @keyframes floatBaby {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .animate-float {
            animation: floatBaby 3s ease-in-out infinite;
        }

        /* Hiệu ứng lật thẻ 3D (Flip Card) */
        .flip-card {
            perspective: 1000px;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom-width: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .flip-card-back {
            transform: rotateY(180deg);
            background: #fdf2f8;
            border-color: #fbcfe8;
        }

        .vowel-front {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #dc2626;
        }

        .consonant-front {
            background: #e0f2fe;
            border-color: #7dd3fc;
            color: #0284c7;
        }
    </style>
</head>
<body class="flex flex-col gap-2 p-2">

    <!-- MÀN HÌNH MỞ KHÓA ÂM THANH iOS -->
    <div id="welcome-view" class="fixed inset-0 z-50 bg-gradient-to-b from-amber-400 to-orange-500 flex flex-col items-center justify-center p-5 text-center text-white">
        <div class="w-32 h-32 rounded-full bg-white border-4 border-amber-200 flex items-center justify-center text-6xl shadow-2xl mb-4 animate-float">🐻</div>
        <span class="bg-white/20 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider mb-2">Tiếng Việt 1 • Chữ Cầm Tay</span>
        <h1 class="text-3xl sm:text-5xl font-black mb-2 drop-shadow-md">GÓC ĐỌC SÁCH</h1>
        <p class="text-sm sm:text-lg font-bold text-orange-100 mb-8">Học các chữ cái đầu tiên theo Sách Giáo Khoa</p>
        <button onclick="startApp()" class="btn-3d bg-white border-b-[6px] border-slate-200 text-orange-600 font-black text-xl sm:text-2xl px-8 py-4 rounded-2xl shadow-xl flex items-center gap-2">
            <span>▶️ BẮT ĐẦU ĐỌC</span><span>🔊</span>
        </button>
    </div>

    <!-- HEADER -->
    <header class="bg-white rounded-2xl shadow-sm border-2 border-amber-200 px-3 py-2 shrink-0 flex items-center justify-between gap-2 z-10">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-xl bg-orange-100 border-2 border-orange-400 flex items-center justify-center text-xl shrink-0">📖</div>
            <div class="flex flex-col">
                <span class="text-[10px] font-black text-orange-500 uppercase">Tiếng Việt Lớp 1</span>
                <span id="header-title" class="text-sm sm:text-base font-black text-slate-800 leading-tight">Bài 1 đến Bài 5 (SGK)</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="shuffleCards()" class="btn-3d bg-sky-500 text-white font-black text-xs sm:text-sm px-3 py-2 rounded-xl shadow border-b-2 border-sky-700">🔀 Đảo chữ</button>
        </div>
    </header>

    <!-- KHU VỰC THẺ CHỮ CÁI -->
    <main class="flex-1 board-3d p-3 flex flex-col relative overflow-hidden bg-amber-50">
        <div class="text-center text-amber-700 font-black text-sm sm:text-base mb-3 shrink-0">
            Gấu chạm vào thẻ để nghe đọc âm vị và xem hình nhé!
        </div>

        <div id="card-grid" class="flex-1 overflow-y-auto grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 pb-4">
            <!-- Render bằng JS -->
        </div>
    </main>

    <script>
    const CHILD_NAME = 'Gấu';

    // Ánh xạ chữ cái, cách đọc âm vị chuẩn, từ vựng và emoji
    const LESSONS = [
      { char: 'a', phonics: 'a', word: 'Quả táo', emoji: '🍎', type: 'vowel' },
      { char: 'b', phonics: 'bờ', word: 'Quả bóng', emoji: '⚽', type: 'consonant' },
      { char: 'c', phonics: 'cờ', word: 'Con cá', emoji: '🐟', type: 'consonant' },
      { char: 'o', phonics: 'o', word: 'Con ong', emoji: '🐝', type: 'vowel' },
      { char: 'ô', phonics: 'ô', word: 'Cái ô', emoji: '☂️', type: 'vowel' },
      { char: 'ơ', phonics: 'ơ', word: 'Cái nơ', emoji: '🎀', type: 'vowel' },
      { char: 'd', phonics: 'dờ', word: 'Con dê', emoji: '🐐', type: 'consonant' },
      { char: 'đ', phonics: 'đờ', word: 'Đàn đá', emoji: '🎹', type: 'consonant' },
      { char: 'e', phonics: 'e', word: 'Em bé', emoji: '👶', type: 'vowel' },
      { char: 'ê', phonics: 'ê', word: 'Quả lê', emoji: '🍐', type: 'vowel' }
    ];

    let audioCtx = null;
    const ttsPlayer = new Audio(); ttsPlayer.referrerPolicy = 'no-referrer';

    function initAudio() {
      if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch(e){} }
      if (!audioCtx) audioCtx = new window.AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function speakVietnamese(text) {
      if (!text) return;
      initAudio(); window.speechSynthesis.cancel();
      const url = `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=vi&q=${encodeURIComponent(text)}`;
      ttsPlayer.pause(); ttsPlayer.src = url;
      ttsPlayer.play().catch(() => {
        if ('speechSynthesis' in window) {
          const utter = new SpeechSynthesisUtterance(text); utter.lang = 'vi-VN'; utter.rate = 0.85; window.speechSynthesis.speak(utter);
        }
      });
    }

    function playPop() {
      initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine'; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }

    function startApp() {
      initAudio();
      document.getElementById('welcome-view').classList.add('hidden');
      renderCards(LESSONS);
      setTimeout(() => speakVietnamese(`Chào ${CHILD_NAME}! Mình cùng học chữ cái nhé!`), 400);
    }

    function shuffleCards() {
      playPop();
      const shuffled = [...LESSONS].sort(() => Math.random() - 0.5);
      renderCards(shuffled);
    }

    function renderCards(data) {
      const grid = document.getElementById('card-grid');
      grid.innerHTML = '';

      data.forEach((item, index) => {
        const cardContainer = document.createElement('div');
        cardContainer.className = 'w-full aspect-[4/5]';

        const frontClass = item.type === 'vowel' ? 'vowel-front' : 'consonant-front';

        cardContainer.innerHTML = `
          <div class="flip-card" id="card-${index}" onclick="flipCard(${index}, '${item.phonics}', '${item.word}')">
            <div class="flip-card-inner">
              <div class="flip-card-front ${frontClass} border-4">
                <span class="text-6xl sm:text-8xl font-black mb-2">${item.char}</span>
              </div>
              <div class="flip-card-back border-4">
                <span class="text-5xl sm:text-7xl mb-2 animate-float">${item.emoji}</span>
                <span class="text-sm sm:text-base font-black text-pink-600">${item.word}</span>
                <span class="text-4xl font-black text-pink-300 mt-2 opacity-30">${item.char}</span>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(cardContainer);
      });
    }

    window.flipCard = function(index, phonics, word) {
      playPop();
      const card = document.getElementById(`card-${index}`);
      const isFlipped = card.classList.contains('flipped');

      // Xóa trạng thái lật của tất cả các thẻ khác
      document.querySelectorAll('.flip-card').forEach(c => {
        if (c.id !== `card-${index}`) c.classList.remove('flipped');
      });

      if (!isFlipped) {
        card.classList.add('flipped');
        // Đọc âm vị (ví dụ: "bờ") rồi đọc từ khóa ("Quả bóng")
        speakVietnamese(`${phonics}. ${word}`);
      } else {
        card.classList.remove('flipped');
      }
    }
    </script>
</body>
</html>
