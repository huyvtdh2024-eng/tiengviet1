  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
      font-family: 'Nunito', sans-serif; background: #fffbe8;
      padding-top: max(env(safe-area-inset-top), 6px); padding-bottom: max(env(safe-area-inset-bottom), 6px); padding-left: max(env(safe-area-inset-left), 6px); padding-right: max(env(safe-area-inset-right), 6px);
    }
    
    .btn-3d { transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
    .btn-3d:active { transform: translateY(4px); border-bottom-width: 0px !important; margin-top: 4px; }
    .board-3d { background: #ffffff; border: 4px solid #fef08a; box-shadow: 0 12px 24px -6px rgba(0,0,0,0.1), inset 0 -6px 0 rgba(0,0,0,0.03); border-radius: 24px; }
    
    @keyframes floatBaby { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .animate-float { animation: floatBaby 3s ease-in-out infinite; }
    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    .animate-pop { animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    .app-view { display: none; width: 100%; height: 100%; flex-direction: column; }
    .app-view.active { display: flex; }

    /* Hiệu ứng lật thẻ 3D */
    .flip-card { perspective: 1000px; width: 100%; height: 100%; cursor: pointer; }
    .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom-width: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .flip-card-back { transform: rotateY(180deg); background: #fdf2f8; border-color: #fbcfe8; }
    .vowel-front { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }
    .consonant-front { background: #e0f2fe; border-color: #7dd3fc; color: #0284c7; }

    /* Máy ghép chữ */
    .slot-machine { background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%); border: 8px solid #cbd5e1; border-radius: 2rem; box-shadow: inset 0 10px 20px rgba(0,0,0,0.05), 0 10px 25px rgba(0,0,0,0.1); }
    .slot-window { background: #ffffff; border: 4px solid #94a3b8; border-radius: 1.2rem; box-shadow: inset 0 8px 15px rgba(0,0,0,0.1); overflow: hidden; position: relative; }
    .slot-item { font-size: 3rem; font-weight: 900; line-height: 1; display: flex; align-items: center; justify-content: center; height: 100px; transition: transform 0.2s ease-out; }
    @media (min-width: 640px) { .slot-item { font-size: 4rem; height: 120px; } }
  </style>
</head>

  <script>
    const CHILD_NAME = 'Gấu';
    
    // FULL DỮ LIỆU BÁM SÁT SGK KẾT NỐI TRI THỨC (BÀI 1 ĐẾN 28)
    const LESSONS = [
      { char: 'a', phonics: 'a', word: 'ca hát', emoji: '🎤', type: 'vowel' },
      { char: 'b', phonics: 'bờ', word: 'ba ba', emoji: '🐢', type: 'consonant' },
      { char: 'c', phonics: 'cờ', word: 'con cá', emoji: '🐟', type: 'consonant' },
      { char: 'e', phonics: 'e', word: 'em bé', emoji: '👶', type: 'vowel' },
      { char: 'ê', phonics: 'ê', word: 'bế bé', emoji: '🤱', type: 'vowel' },
      { char: 'o', phonics: 'o', word: 'con bò', emoji: '🐄', type: 'vowel' },
      { char: 'ô', phonics: 'ô', word: 'ô tô', emoji: '🚗', type: 'vowel' },
      { char: 'ơ', phonics: 'ơ', word: 'cá cờ', emoji: '🐠', type: 'vowel' },
      { char: 'd', phonics: 'dờ', word: 'đá dế', emoji: '🦗', type: 'consonant' },
      { char: 'đ', phonics: 'đờ', word: 'đi đò', emoji: '🛶', type: 'consonant' },
      { char: 'k', phonics: 'ca', word: 'kì đà', emoji: '🦎', type: 'consonant' },
      { char: 'h', phonics: 'hờ', word: 'bờ hồ', emoji: '🏞️', type: 'consonant' },
      { char: 'l', phonics: 'lờ', word: 'le le', emoji: '🦆', type: 'consonant' },
      { char: 'ch', phonics: 'chờ', word: 'chú khỉ', emoji: '🐒', type: 'consonant' },
      { char: 'kh', phonics: 'khờ', word: 'lá khô', emoji: '🍂', type: 'consonant' },
      { char: 'm', phonics: 'mờ', word: 'cá mè', emoji: '🐟', type: 'consonant' },
      { char: 'n', phonics: 'nờ', word: 'nơ đỏ', emoji: '🎀', type: 'consonant' },
      { char: 'g', phonics: 'gờ', word: 'gà gô', emoji: '🐓', type: 'consonant' },
      { char: 'gi', phonics: 'di', word: 'giá đỗ', emoji: '🌱', type: 'consonant' },
      { char: 'gh', phonics: 'gờ', word: 'ghế đá', emoji: '🪑', type: 'consonant' },
      { char: 'nh', phonics: 'nhờ', word: 'nhà gỗ', emoji: '🏠', type: 'consonant' },
      { char: 'ng', phonics: 'ngờ', word: 'ngã ba', emoji: '🛣️', type: 'consonant' },
      { char: 'ngh', phonics: 'ngờ', word: 'củ nghệ', emoji: '🥔', type: 'consonant' },
      { char: 'ph', phonics: 'phờ', word: 'phố cổ', emoji: '🏘️', type: 'consonant' },
      { char: 'qu', phonics: 'quờ', word: 'quả khế', emoji: '⭐', type: 'consonant' }
    ];

    // DỮ LIỆU CỖ MÁY GHÉP VẦN (Mở rộng thêm âm kép)
    const CONSONANTS = [
      { char: 'b', sound: 'bờ' }, { char: 'c', sound: 'cờ' }, { char: 'd', sound: 'dờ' }, { char: 'đ', sound: 'đờ' },
      { char: 'g', sound: 'gờ' }, { char: 'h', sound: 'hờ' }, { char: 'l', sound: 'lờ' }, { char: 'm', sound: 'mờ' },
      { char: 'n', sound: 'nờ' }, { char: 'v', sound: 'vờ' }, { char: 'ch', sound: 'chờ' }, { char: 'kh', sound: 'khờ' },
      { char: 'nh', sound: 'nhờ' }, { char: 'th', sound: 'thờ' }, { char: 'tr', sound: 'trờ' }, { char: 'ph', sound: 'phờ' }
    ];
    const VOWELS = ['a', 'o', 'ô', 'ơ', 'u', 'ư', 'e', 'ê', 'i'];
    const TONES = [
      { id: 'ngang', mark: '', visual: '—', name: 'Ngang' },
      { id: 'huyen', mark: '\u0300', visual: 'ˋ', name: 'Huyền' },
      { id: 'sac', mark: '\u0301', visual: 'ˊ', name: 'Sắc' },
      { id: 'hoi', mark: '\u0309', visual: 'ˀ', name: 'Hỏi' },
      { id: 'nga', mark: '\u0303', visual: '˜', name: 'Ngã' },
      { id: 'nang', mark: '\u0323', visual: '•', name: 'Nặng' }
    ];

    // BÀI 29 SGK: KIỂM TRA LUẬT CHÍNH TẢ (c/k, g/gh, ng/ngh đi với e, ê, i)
    const QUIZZES = [
      { word: 'cá cờ', display: 'á cờ', missing: 'c', options: ['c', 'k', 'g'], emoji: '🐠' },
      { word: 'kẻ ô', display: 'ẻ ô', missing: 'k', options: ['k', 'c', 'h'], emoji: '📏' },
      { word: 'gà gô', display: 'à gô', missing: 'g', options: ['g', 'gh', 'ng'], emoji: '🐓' },
      { word: 'ghế đá', display: 'ế đá', missing: 'gh', options: ['gh', 'g', 'nh'], emoji: '🪑' },
      { word: 'ngã ba', display: 'ã ba', missing: 'ng', options: ['ng', 'ngh', 'nh'], emoji: '🛣️' },
      { word: 'củ nghệ', display: 'ủ nghệ', missing: 'ngh', options: ['ngh', 'ng', 'gh'], emoji: '🥔' },
      { word: 'đi đò', display: 'i đò', missing: 'đ', options: ['d', 'đ', 'b'], emoji: '🛶' },
      { word: 'kì đà', display: 'ì đà', missing: 'k', options: ['c', 'k', 'kh'], emoji: '🦎' }
    ];

    const state = { view: 'dashboard-view', cIdx: 0, vIdx: 0, tIdx: 1, currentQuiz: null };
    
    /* --- HỆ THỐNG ÂM THANH KÉP --- */
    let audioCtx = null;
    const ttsPlayer = new Audio(); ttsPlayer.referrerPolicy = 'no-referrer';

    function initAudio() {
      if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch(e){} }
      if (!audioCtx) audioCtx = new window.AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function forceWakeUpTTS() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const silent = new SpeechSynthesisUtterance(' '); silent.volume = 0; window.speechSynthesis.speak(silent);
      }
    }

    function playSound(type) {
      initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'pop') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'success') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    function speakVietnamese(text) {
      if (!text) return;
      initAudio();
      const url = `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=vi&q=${encodeURIComponent(text)}`;
      ttsPlayer.pause(); ttsPlayer.src = url;
      ttsPlayer.play().catch(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text); utter.lang = 'vi-VN'; utter.rate = 0.85; window.speechSynthesis.speak(utter);
        }
      });
    }

    /* --- ĐIỀU HƯỚNG --- */
    function startAppWithAudio() {
      initAudio(); forceWakeUpTTS(); playSound('success');
      document.getElementById('welcome-view').classList.add('hidden');
      switchView('dashboard-view');
      setTimeout(() => speakVietnamese(`Chào ${CHILD_NAME}! Mình cùng học chữ cái nhé!`), 400);
      renderCards(LESSONS);
      updateSlotUI();
    }

    function switchView(viewId) {
      playSound('pop');
      document.querySelectorAll('.app-view').forEach(el => {
        if (el.id === viewId) { el.classList.remove('hidden'); el.classList.add('flex'); }
        else { el.classList.add('hidden'); el.classList.remove('flex'); }
      });
    }

    /* --- BÀI 1: BẢNG LẬT THẺ --- */
    function shuffleCards() {
      playSound('pop');
      const shuffled = [...LESSONS].sort(() => Math.random() - 0.5);
      renderCards(shuffled);
    }

    function renderCards(data) {
      const grid = document.getElementById('card-grid'); grid.innerHTML = '';
      data.forEach((item, index) => {
        const div = document.createElement('div'); div.className = 'w-full aspect-[4/5]';
        const frontClass = item.type === 'vowel' ? 'vowel-front' : 'consonant-front';
        const fontSize = item.char.length > 2 ? 'text-3xl sm:text-5xl' : item.char.length > 1 ? 'text-4xl sm:text-6xl' : 'text-5xl sm:text-7xl';
        div.innerHTML = `
          <div class="flip-card" id="card-${index}" onclick="flipCard(${index}, '${item.phonics}', '${item.word}')">
            <div class="flip-card-inner">
              <div class="flip-card-front ${frontClass} border-4"><span class="${fontSize} font-black mb-1">${item.char}</span></div>
              <div class="flip-card-back border-4">
                <span class="text-4xl sm:text-6xl mb-1 animate-float">${item.emoji}</span>
                <span class="text-xs sm:text-sm font-black text-pink-600 truncate px-1">${item.word}</span>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    window.flipCard = function(index, phonics, word) {
      playSound('pop');
      const card = document.getElementById(`card-${index}`);
      const isFlipped = card.classList.contains('flipped');
      document.querySelectorAll('.flip-card').forEach(c => { if (c.id !== `card-${index}`) c.classList.remove('flipped'); });
      if (!isFlipped) {
        card.classList.add('flipped');
        speakVietnamese(`${phonics}. ${word}`);
      } else { card.classList.remove('flipped'); }
    }

    /* --- BÀI 2: CỖ MÁY GHÉP VẦN --- */
    function changeSlot(type, dir) {
      playSound('pop');
      if (type === 'c') { state.cIdx = (state.cIdx + dir + CONSONANTS.length) % CONSONANTS.length; animSlot('slot-c'); }
      else if (type === 'v') { state.vIdx = (state.vIdx + dir + VOWELS.length) % VOWELS.length; animSlot('slot-v'); }
      else if (type === 't') { state.tIdx = (state.tIdx + dir + TONES.length) % TONES.length; animSlot('slot-t-visual'); }
      updateSlotUI();
    }

    function animSlot(id) {
      const el = document.getElementById(id);
      el.style.transform = 'scale(0.5) translateY(10px)'; el.style.opacity = '0';
      setTimeout(() => { el.style.transform = 'scale(1) translateY(0)'; el.style.opacity = '1'; }, 100);
    }

    function getCombinedWord() {
      const c = CONSONANTS[state.cIdx]; const v = VOWELS[state.vIdx]; const t = TONES[state.tIdx];
      // Một số quy tắc chính tả cơ bản khi ghép
      let finalVowel = v; let finalConsonant = c.char;
      if(finalConsonant === 'k' && !['e','ê','i'].includes(v)) finalConsonant = 'c';
      if(finalConsonant === 'gh' && !['e','ê','i'].includes(v)) finalConsonant = 'g';
      if(finalConsonant === 'ngh' && !['e','ê','i'].includes(v)) finalConsonant = 'ng';
      return (finalConsonant + finalVowel + t.mark).normalize('NFC');
    }

    function updateSlotUI() {
      const c = CONSONANTS[state.cIdx];
      const fontC = c.char.length > 2 ? 'text-4xl sm:text-5xl' : c.char.length > 1 ? 'text-5xl sm:text-6xl' : 'text-6xl sm:text-7xl';
      
      const elC = document.getElementById('slot-c');
      elC.textContent = c.char;
      elC.className = `slot-item text-sky-600 ${fontC}`;

      document.getElementById('slot-v').textContent = VOWELS[state.vIdx];
      document.getElementById('slot-t-visual').textContent = TONES[state.tIdx].visual;
      document.getElementById('slot-t-name').textContent = TONES[state.tIdx].name;
      
      const res = document.getElementById('final-word');
      res.textContent = getCombinedWord();
      res.classList.remove('animate-pop'); void res.offsetWidth; res.classList.add('animate-pop');
    }

    function playResult() {
      initAudio();
      const c = CONSONANTS[state.cIdx]; const v = VOWELS[state.vIdx]; const t = TONES[state.tIdx];
      const baseWord = (c.char + v).normalize('NFC');
      const finalWord = getCombinedWord();

      let spellString = t.id === 'ngang' ? `${c.sound}, ${v}, ${baseWord}` : `${c.sound}, ${v}, ${baseWord}, dấu ${t.name.toLowerCase()}, ${finalWord}`;

      window.speechSynthesis.cancel();
      const url = `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=vi&q=${encodeURIComponent(spellString)}`;
      ttsPlayer.pause(); ttsPlayer.src = url;
      
      const btn = document.querySelector('#machine-view button[onclick="playResult()"]');
      if(btn) btn.classList.add('scale-105', 'bg-amber-300');
      
      ttsPlayer.play().then(() => { ttsPlayer.onended = () => { if(btn) btn.classList.remove('scale-105', 'bg-amber-300'); } })
      .catch(() => {
        if ('speechSynthesis' in window) {
          const utter = new SpeechSynthesisUtterance(spellString); utter.lang = 'vi-VN'; utter.rate = 0.8;
          utter.onend = () => { if(btn) btn.classList.remove('scale-105', 'bg-amber-300'); };
          window.speechSynthesis.speak(utter);
        }
      });
    }

    /* --- BÀI 3: TRÒ CHƠI ĐIỀN CHỮ CHÍNH TẢ --- */
    function loadQuiz() {
      const q = QUIZZES[Math.floor(Math.random() * QUIZZES.length)];
      state.currentQuiz = q;
      
      document.getElementById('quiz-emoji').textContent = q.emoji;
      document.getElementById('quiz-remainder').textContent = q.display;
      
      const blank = document.getElementById('quiz-blank');
      blank.className = 'min-w-[4rem] px-2 h-20 sm:min-w-[6rem] sm:h-28 bg-white border-4 border-dashed border-emerald-400 rounded-2xl flex items-center justify-center text-5xl sm:text-7xl font-black text-emerald-600 shadow-inner transition-all';
      blank.textContent = '?';

      const optionsBox = document.getElementById('quiz-options');
      optionsBox.innerHTML = '';
      
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        const fontOpt = opt.length > 2 ? 'text-3xl sm:text-4xl' : opt.length > 1 ? 'text-4xl sm:text-5xl' : 'text-5xl sm:text-6xl';
        btn.className = `btn-3d flex-1 bg-white border-4 border-slate-200 border-b-[6px] text-slate-700 ${fontOpt} font-black py-4 rounded-2xl shadow hover:bg-slate-50`;
        btn.textContent = opt;
        btn.onclick = () => checkQuizAnswer(opt);
        optionsBox.appendChild(btn);
      });

      setTimeout(() => speakQuizWord(), 500);
    }

    function speakQuizWord() {
      if (state.currentQuiz) speakVietnamese(state.currentQuiz.word);
    }

    window.checkQuizAnswer = function(selectedLetter) {
      if (selectedLetter === state.currentQuiz.missing) {
        playSound('success');
        triggerConfetti();
        
        const blank = document.getElementById('quiz-blank');
        blank.className = 'min-w-[4rem] px-2 h-20 sm:min-w-[6rem] sm:h-28 bg-emerald-500 border-4 border-emerald-600 rounded-2xl flex items-center justify-center text-4xl sm:text-6xl font-black text-white shadow-lg animate-pop';
        blank.textContent = selectedLetter;
        
        speakVietnamese(`Đúng rồi! ${state.currentQuiz.word}`);
        
        setTimeout(() => loadQuiz(), 3000);
      } else {
        playSound('wrong');
        speakVietnamese(`Chưa đúng rồi, Gấu nhớ lại luật chính tả e, ê, i nhé!`);
      }
    }

    function triggerConfetti() {
      const cvs = document.getElementById('confetti-canvas'); const ctx = cvs.getContext('2d'); cvs.width = window.innerWidth; cvs.height = window.innerHeight;
      const p = Array.from({length:40}, ()=>({x:cvs.width/2, y:cvs.height/2, vx:(Math.random()-0.5)*15, vy:(Math.random()-0.8)*15, s:Math.random()*8+6, c:['#ec4899','#f59e0b','#8b5cf6','#10b981','#3b82f6'][Math.floor(Math.random()*5)]}));
      let f = 0; function anim() { ctx.clearRect(0,0,cvs.width,cvs.height); p.forEach(i=>{i.x+=i.vx;i.y+=i.vy;i.vy+=0.5;ctx.fillStyle=i.c;ctx.fillRect(i.x,i.y,i.s,i.s)}); if(++f<35) requestAnimationFrame(anim); else ctx.clearRect(0,0,cvs.width,cvs.height); } anim();
    }
  </script>
